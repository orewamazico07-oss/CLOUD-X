<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOUD-X | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --surface: rgba(10, 15, 29, 0.88);
            --border-glow: rgba(0, 210, 255, 0.35);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --success: #00ff88;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
        .ambient-glow { position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: radial-gradient(circle at 10% 10%, rgba(0, 210, 255, 0.06) 0%, transparent 40%); z-index: -2; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 16px; }
        .top-header { width: 100%; text-align: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .logo-area { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .logo-area span { color: var(--primary); text-shadow: 0 0 18px var(--primary-glow); }
        .sub-header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .server-badge { font-size: 10px; font-weight: 600; color: var(--success); background: rgba(0, 255, 136, 0.06); border: 1px solid rgba(0, 255, 136, 0.2); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
        .blink-dot { width: 5px; height: 5px; background-color: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); }
        .card { background: var(--surface); backdrop-filter: blur(25px); padding: 20px; border-radius: 16px; border: 1px solid var(--border-glow); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .card h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .stat-box { background: rgba(3, 5, 8, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); padding: 14px; border-radius: 12px; }
        .stat-box span { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .stat-box h4 { font-size: 14px; margin-top: 4px; color: var(--text-main); }
        .upload-box { border: 2px dashed rgba(0, 210, 255, 0.3); background: rgba(3, 5, 8, 0.4); padding: 25px; text-align: center; border-radius: 12px; }
        .upload-box i { font-size: 28px; color: var(--primary); margin-bottom: 8px; }
        .upload-box p { font-size: 11.5px; color: var(--text-muted); }
        .files-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .files-table th, .files-table td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .files-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 10px; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <div class="top-header"><div class="logo-area">CLOUD <span>X</span></div></div>
        <div class="sub-header">
            <div style="font-size: 12px; color: var(--text-muted);">Secure Portal</div>
            <div class="server-badge"><div class="blink-dot"></div>ACTIVE SERVER - CLOUD X</div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-chart-pie"></i> Infrastructure Metrics</h3>
            <div class="stats-grid">
                <div class="stat-box"><span>Active Servers</span><h4 style="color: var(--primary);">cloudX ViP</h4></div>
                <div class="stat-box"><span>Node Status</span><h4 style="color: var(--success);">Online</h4></div>
            </div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> Secure Media Vault (Photos & Videos)</h3>
            <div class="upload-box">
                <i class="fa-solid fa-folder-open"></i>
                <p>No storage media available or vault is empty.</p>
            </div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-vault"></i> Stored Vault Files</h3>
            <table class="files-table">
                <thead><tr><th>File Name</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No files found in storage.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
