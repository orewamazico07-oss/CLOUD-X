<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOUD-X | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --surface: rgba(10, 15, 29, 0.88);
            --border-glow: rgba(0, 210, 255, 0.35);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --accent: #3a7bd5;
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --success: #00ff88;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(58, 123, 213, 0.08) 0%, transparent 40%);
            z-index: -2;
        }

        .cyber-grid {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .header-top {
            text-align: center;
            margin-bottom: 25px;
            animation: slideDown 0.6s ease;
        }

        .logo-area {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-area span {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .server-status {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .blink-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulseGlow 2s infinite;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.fa-solid {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            transition: 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(3, 5, 8, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 14px 12px 40px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: rgba(3, 5, 8, 0.9);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ .input-icons-right i {
            color: var(--primary);
        }

        .input-icons-right {
            position: absolute;
            right: 14px;
            cursor: pointer;
        }

        .input-icons-right i {
            color: var(--text-muted);
            font-size: 14px;
            transition: 0.3s;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
            transform: translateY(-1px);
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .switch-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .footer-container {
            margin-top: 25px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .footer-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .badge-item {
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 5px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .badge-item i {
            color: var(--primary);
        }

        .security-note {
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .security-note span {
            color: var(--primary);
            font-weight: 600;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.5); }
            70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 6px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="cyber-grid"></div>

    <div class="header-top">
        <div class="logo-area">CLOUD <span>X</span></div>
        <div class="server-status">
            <div class="blink-dot"></div>
            SERVER - NENO CONNECTED
        </div>
    </div>

    <div class="card">
        <h2>LOGIN TO CLOUD-X</h2>
        
        <form id="loginForm" onsubmit="submitLogin(event)">
            <!-- Username -->
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-at"></i>
                    <input type="text" id="username" required placeholder="">
                </div>
            </div>

            <!-- Email Address -->
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" required placeholder="">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="">
                    <div class="input-icons-right">
                        <i class="fa-solid fa-eye toggle-password" onclick="toggleVisibility('password', this)"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Login Account</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a href="/">Sign Up</a>
        </div>
    </div>

    <div class="footer-container">
        <div class="footer-badges">
            <div class="badge-item"><i class="fa-solid fa-shield-halved"></i> GOOGLE VERIFIED</div>
            <div class="badge-item"><i class="fa-solid fa-lock"></i> SSL SECURE</div>
            <div class="badge-item"><i class="fa-solid fa-bolt"></i> FAST CLOUD</div>
        </div>
        <div class="security-note">
            Protected by advanced <span>Cloud-X Neural Security</span>. End-to-end encrypted protocol.
        </div>
    </div>

    <script>
        document.getElementById('username').addEventListener('input', function(e) {
            this.value = this.value.toLowerCase();
        });

        function toggleVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                iconElement.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                iconElement.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function submitLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const loginData = {
                username: username,
                email: email,
                password: password
            };

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // সফলভাবে লগইন হওয়ার পর পাসকি পেজে রিডাইরেক্ট করবে
                    window.location.href = '/passkey';
                } else {
                    alert("Error: " + (data.message || "Invalid credentials"));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Something went wrong!");
            });
        }
    </script>
</body>
</html>
