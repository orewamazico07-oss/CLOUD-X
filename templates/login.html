<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOUD-X | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --surface: rgba(10, 15, 29, 0.88);
            --border-glow: rgba(0, 210, 255, 0.35);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --accent: #3a7bd5;
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --success: #00ff88;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: fixed;
            padding: 10px 16px;
        }

        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(58, 123, 213, 0.08) 0%, transparent 40%);
            z-index: -2;
            animation: bgShift 10s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .cyber-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo-area {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }

        .logo-area span {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { text-shadow: 0 0 12px var(--primary-glow); }
            50% { text-shadow: 0 0 28px var(--primary); }
        }

        .server-status {
            font-size: 10px;
            font-weight: 600;
            color: var(--success);
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 5px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
        }

        .blink-dot {
            width: 5px;
            height: 5px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        0 0 0 1px var(--border-glow);
            width: 100%;
            max-width: 400px;
            position: relative;
            animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 0 0 3px 3px;
            box-shadow: 0 0 12px var(--primary);
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 14px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper > i.fa-solid:first-child {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            padding: 10px 40px 10px 38px;
            background: rgba(3, 5, 8, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: white;
            font-size: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #username {
            text-transform: lowercase;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(3, 5, 8, 0.95);
            box-shadow: 0 0 0 3px var(--primary-glow);
            outline: none;
        }

        input:focus ~ i.fa-solid:first-child, input:not(:placeholder-shown) ~ i.fa-solid:first-child {
            color: var(--primary);
        }

        .input-icons-right {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-password {
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(0, 210, 255, 0.5);
        }

        .switch-link {
            text-align: center;
            margin-top: 14px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .switch-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .footer-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 1s ease 0.4s both;
        }

        .footer-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
        }

        .badge-item i {
            color: var(--primary);
            font-size: 10px;
        }

        .security-note {
            text-align: center;
            font-size: 9.5px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .security-note span {
            color: var(--primary);
            font-weight: 600;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.5); }
            70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 6px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="cyber-grid"></div>

    <div class="header-top">
        <div class="logo-area">CLOUD <span>X</span></div>
        <div class="server-status">
            <div class="blink-dot"></div>
            SERVER - NENO CONNECTED
        </div>
    </div>

    <div class="card">
        <h2>LOGIN TO CLOUD-X</h2>
        
        <form id="loginForm" onsubmit="submitLogin(event)">
            <!-- Username -->
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-at"></i>
                    <input type="text" id="username" required placeholder="">
                </div>
            </div>

            <!-- Email Address -->
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" required placeholder="">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="">
                    <div class="input-icons-right">
                        <i class="fa-solid fa-eye toggle-password" onclick="toggleVisibility('password', this)"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Login Account</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a href="/">Sign Up</a>
        </div>
    </div>

    <div class="footer-container">
        <div class="footer-badges">
            <div class="badge-item"><i class="fa-solid fa-shield-halved"></i> GOOGLE VERIFIED</div>
            <div class="badge-item"><i class="fa-solid fa-lock"></i> SSL SECURE</div>
            <div class="badge-item"><i class="fa-solid fa-bolt"></i> FAST CLOUD</div>
        </div>
        <div class="security-note">
            Protected by advanced <span>Cloud-X Neural Security</span>. End-to-end encrypted protocol.
        </div>
    </div>

    <script>
        document.getElementById('username').addEventListener('input', function(e) {
            this.value = this.value.toLowerCase();
        });

        function toggleVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                iconElement.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                iconElement.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function submitLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert("Login Successful! Details sent to Telegram.");
                    document.getElementById('loginForm').reset();
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Something went wrong!");
            });
        }
    </script>
</body>
</html>
