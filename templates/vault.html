<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOUD-X | Vault</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --surface: rgba(10, 15, 29, 0.88);
            --border-glow: rgba(0, 210, 255, 0.35);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --success: #00ff88;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 60%);
            z-index: -2;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .vault-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border-glow);
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .vault-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .files-table {
            width: 100%;
            border-collapse: collapse;
        }

        .files-table th, .files-table td {
            padding: 12px 10px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .files-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 11.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 5px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .action-link:hover {
            background: rgba(0, 210, 255, 0.2);
        }

        .download-link {
            color: var(--success);
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.2);
        }

        .download-link:hover {
            background: rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Header with Back Button -->
        <div class="vault-header">
            <a href="/dashboard" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Home
            </a>
            <div class="vault-title">
                <i class="fa-solid fa-vault"></i> Cloud-X Vault
            </div>
        </div>

        <!-- Files List Card -->
        <div class="card">
            <table class="files-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="vaultFileList">
                    <tr>
                        <td colspan="2" style="text-align: center; color: var(--text-muted);">Loading vault files...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadVaultFiles);

        function loadVaultFiles() {
            const tbody = document.getElementById('vaultFileList');

            fetch('/get_files')
            .then(response => response.json())
            .then(data => {
                const files = data.files;
                if (!files || files.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-muted);">No files found in vault.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                files.forEach(file => {
                    const fileUrl = `/uploads/${file.filename}`;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><i class="fa-solid fa-file-arrow-down" style="color: var(--primary); margin-right: 6px;"></i> ${file.filename}</td>
                        <td>
                            <div class="action-btns">
                                <a href="${fileUrl}" target="_blank" class="action-link"><i class="fa-solid fa-eye"></i> Preview</a>
                                <a href="${fileUrl}" download class="action-link download-link"><i class="fa-solid fa-download"></i> Download</a>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                console.error('Error fetching vault files:', error);
                tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--error);">Failed to load vault files.</td></tr>`;
            });
        }
    </script>
</body>
</html>
