<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOUD-X | Security Passkey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030508;
            --surface: rgba(10, 15, 29, 0.88);
            --border-glow: rgba(0, 210, 255, 0.35);
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.06) 0%, transparent 60%);
            z-index: -2;
        }

        .passkey-card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .lock-icon {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 12px;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* 6 Dot indicators */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--border-glow);
            background: rgba(3, 5, 8, 0.5);
            transition: 0.2s ease;
        }

        .dot.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Numpad 0-9 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 260px;
            margin: 0 auto;
        }

        .num-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255,5, 0.08);
            color: var(--text-main);
            font-size: 20px;
            font-weight: 600;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .num-btn:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .num-btn.clear {
            font-size: 14px;
            color: var(--error);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .num-btn.zero {
            grid-column: 2;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="passkey-card">
        <div class="lock-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>Vault Passkey Required</h2>
        <p>Enter your 6-digit security passkey to proceed</p>

        <div class="dots-container" id="dotsContainer">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="numpad">
            <button class="num-btn" onclick="pressNum('1')">1</button>
            <button class="num-btn" onclick="pressNum('2')">2</button>
            <button class="num-btn" onclick="pressNum('3')">3</button>
            <button class="num-btn" onclick="pressNum('4')">4</button>
            <button class="num-btn" onclick="pressNum('5')">5</button>
            <button class="num-btn" onclick="pressNum('6')">6</button>
            <button class="num-btn" onclick="pressNum('7')">7</button>
            <button class="num-btn" onclick="pressNum('8')">8</button>
            <button class="num-btn" onclick="pressNum('9')">9</button>
            <button class="num-btn clear" onclick="clearPasskey()">C</button>
            <button class="num-btn zero" onclick="pressNum('0')">0</button>
        </div>
    </div>

    <script>
        let currentPasskey = "";

        function pressNum(num) {
            if (currentPasskey.length < 6) {
                currentPasskey += num;
                updateDots();

                if (currentPasskey.length === 6) {
                    verifyPasskey();
                }
            }
        }

        function clearPasskey() {
            currentPasskey = "";
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index < currentPasskey.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function verifyPasskey() {
            fetch('/verify-passkey', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passkey: currentPasskey })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'real') {
                    window.location.href = '/dashboard';
                } else if (data.status === 'fake') {
                    window.location.href = '/fake-dashboard';
                } else {
                    alert('Invalid Passkey! Try again.');
                    clearPasskey();
                }
            })
            .catch(err => {
                console.error(err);
                clearPasskey();
            });
        }
    </script>
</body>
</html>
